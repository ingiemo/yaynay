<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f8f3f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161214" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="YayNay">
  <meta name="description" content="Spart eller smakt: tell kaloriene du lar være.">
  <title>YayNay</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main id="views">
    <section class="view" id="view-fristelse" hidden></section>
    <section class="view" id="view-oversikt" hidden></section>
    <section class="view" id="view-innstillinger" hidden></section>
  </main>

  <nav class="tabbar" aria-label="Hovedmeny">
    <a href="#fristelse" data-tab="fristelse">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M7.8 10.2 3 7.5v9l4.8-2.7M16.2 10.2 21 7.5v9l-4.8-2.7"/></svg>
      <span>Fristelse</span>
    </a>
    <a href="#oversikt" data-tab="oversikt">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg>
      <span>Oversikt</span>
    </a>
    <a href="#innstillinger" data-tab="innstillinger">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
      <span>Innstillinger</span>
    </a>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>

  <div id="update" class="update" role="status" hidden>
    <span>Ny versjon er klar</span>
    <button type="button" id="update-btn">Oppdater</button>
  </div>
</body>
</html>
